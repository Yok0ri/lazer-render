name: Publish container image

# Builds the single image that holds both halves (service + prebuilt engine) and pushes it to
# GitHub Container Registry. The engine build needs the pinned osu! submodule, so the checkout
# below is recursive — that is the whole reason this cannot be built by Portainer from a plain clone.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # Must be lowercase: Docker rejects uppercase repository names, and the account is "Yok0ri".
  IMAGE: ghcr.io/yok0ri/lazer-render

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (with the osu! submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.0.4 -> 1.0.4, 1.0, latest ; a main push -> main, sha-<commit>
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
